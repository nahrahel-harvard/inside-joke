[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inside-joke"
version = "0.1.0"
description = "Turns public professional facts into a small personalized animated GIF joke, with deterministic guardrails and a cross-family judge."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nahrahel Louis" }]
requires-python = ">=3.11"
dependencies = [
    "pillow==13.0.0",
    "resvg-py==0.5.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Study toolkit (study/analysis.py). Same pins as requirements-study.txt.
study = ["numpy==2.5.5", "scipy==1.18.1"]

[project.urls]
Homepage = "https://nahrahel-harvard.github.io/inside-joke/"
Source = "https://github.com/nahrahel-harvard/inside-joke"
Issues = "https://github.com/nahrahel-harvard/inside-joke/issues"

[tool.setuptools]
packages = ["inside_joke"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["out", "docs/private", "site", "study_data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # prompt strings in concept.py and formats.py are long on purpose; line-length still drives formatting
    "E741",  # render.py uses `l` for "left" in crop math
]


[tool.ruff.lint.isort]
known-first-party = ["inside_joke", "study"]
