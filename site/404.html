<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Inside Joke</title>
<link rel="icon" href="/inside-joke/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root { --canvas: #f5f0e5; --ink: #1d1a16; --ink-2: #463f36; --accent: #b02a1f; --accent-ink: #fff8ef; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink); font: 400 17px/1.55 "Instrument Sans", Arial, sans-serif; padding: 24px 16px; }
main { max-width: 34em; }
p.code { font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em; color: var(--accent); margin: 0 0 16px; }
h1 { font: 600 clamp(36px, 7vw, 56px)/1.05 "Fraunces", Georgia, serif; letter-spacing: -0.03em; margin: 0 0 16px; }
p { color: var(--ink-2); margin: 0 0 24px; }
a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
a.btn:hover { background: #8f2118; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>The address may be mistyped, or the page moved. Everything about Inside Joke lives on the main page.</p>
  <a class="btn" href="/inside-joke/">Go to Inside Joke</a>
</main>
</body>
</html>
