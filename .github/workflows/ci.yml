name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-study.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-study.txt
          pip install ruff==0.17.6
      - name: Ruff
        run: ruff check .
      - name: Unit tests (offline, no API key)
        env:
          OPENROUTER_API_KEY: ""
        run: python -m unittest discover -s tests -v

  render:
    name: Render all 5 formats offline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render with placeholder art and bundled fonts
        env:
          OPENROUTER_API_KEY: ""
        run: python tests/fixtures.py --out ci-gifs
      - name: Upload GIFs
        uses: actions/upload-artifact@v4
        with:
          name: inside-joke-offline-gifs
          path: |
            ci-gifs/*.gif
            ci-gifs/*.png
          if-no-files-found: error
          retention-days: 14
